# Exam-day stack: Postgres + 2 API replicas + Nginx load balancer.
# Local SQLite (`npm run dev`) is for demos only — use this for ~1000 concurrent users.
#
# Before first up:
#   1. Set prisma/schema.prisma datasource provider = "postgresql"
#   2. Copy backend/.env.postgres.example → backend/.env (or set env below)
#   3. docker compose up --build
#
# Check overall:  http://localhost/api/capacity
# Health:         http://localhost/api/health
# Ready:          http://localhost/api/ready

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: placement
      POSTGRES_DB: placement
    ports:
      - "5432:5432"
    volumes:
      - placement_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement -d placement"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &api_env
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://placement:placement@db:5432/placement?schema=public
      JWT_SECRET: ${JWT_SECRET:-docker-compose-exam-secret-min-32-chars-ok}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost,http://127.0.0.1}
      TRUST_PROXY: "1"
      EXPECTED_CONCURRENT_USERS: "1000"
      API_REPLICAS: "2"
      DB_POOL_SIZE: "15"
      SEED_ON_START: ${SEED_ON_START:-false}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
      INSTANCE_ID: api1
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"

  api2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *api_env
      INSTANCE_ID: api2
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"

  lb:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  placement_pg:
